on:
  push:
    tags:
      - "v*"
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      # Required to create GH releases
      contents: write
      # Required to push to GHCR
      packages: write
      # Required by cosign keyless signing
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install dependencies
        uses: ./.github/actions/install-dependencies

      - name: Build wit interface
        shell: bash
        run: |
          just build

      - name: Login to GitHub Container Registry
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get Version without 'v' prefix
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Publish WIT
        uses: ./.github/actions/wit
        with:
          file: 'tofuya-interface.wasm'
          oci-description: 'The WASM Interface Type for Tofuya Plugins'
          oci-reference-without-tag: 'ghcr.io/tmuntaner/tofuya/plugin-interface'
          version: ${{ steps.version.outputs.VERSION }}
